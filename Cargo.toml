[package]
name = "r2mml"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Risk2MacModLoader — a native macOS mod manager for Risk2Mac"
license = "MIT"
repository = "https://github.com/TsiFroviK/R2MML"
default-run = "r2mml"

[dependencies]
anyhow = "1"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui_extras = { version = "=0.33.3", features = ["all_loaders"] }
egui_commonmark = { version = "=0.22.0", default-features = false, features = ["pulldown_cmark", "fetch"] }
pulldown-cmark = "0.13"
html5gum = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
plist = "1"
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["metal"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[[bin]]
name = "r2mml"
path = "src/main.rs"

[[bin]]
name = "package"
path = "tools/package.rs"
